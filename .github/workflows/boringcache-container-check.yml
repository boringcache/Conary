name: BoringCache Arch container check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  shutdown:
    name: BoringCache Arch ${{ matrix.name }} shutdown check
    if: github.repository == 'boringcache/Conary' && github.ref == 'refs/heads/boringcache-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: init
            options: --init
          - name: no init
            options: ''
    container:
      image: docker.io/library/archlinux@sha256:fe6972d4dc1f660c0c10f4c41b2de8986bab89e7e2955378f8beadb8ebcd7433
      options: ${{ matrix.options }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: operator
          persist-credentials: false
      - uses: ./operator/.github/actions/boringcache-arch-setup
      - name: Install the compiler-cache prerequisite
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: sccache@0.17.0
      - name: Configure a read-only compiler backend
        id: cache
        uses: boringcache/one@90111526eb218a7f1e119ac2b29f765bd4d82734 # v1.21.0
        with:
          mode: sccache
          working-directory: operator
          trust-policy: restore
          fail-on-cache-error: true
      - name: Record process state without compiling
        run: |
          ps -eo pid,ppid,stat,comm | tee "$RUNNER_TEMP/validation/processes.txt"
          sccache --show-stats --stats-format json > "$RUNNER_TEMP/validation/sccache.json"
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: container-${{ matrix.name }}-${{ github.run_id }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/validation
            ${{ steps.cache.outputs.evidence-path }}
