name: BoringCache Arch validation

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Run the fresh comparison or read an existing seed on a fresh runner
        required: false
        default: fresh
        type: choice
        options: [fresh, warm]
      skip_uncached:
        description: Reuse the retained uncached sample for this exact source and runner configuration
        required: false
        default: false
        type: boolean
      cli_version:
        description: Optional exact BoringCache CLI release or prerelease tag
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: boringcache-arch-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"

jobs:
  uncached:
    name: No cache Arch uncached
    if: github.repository == 'boringcache/Conary' && github.ref == 'refs/heads/boringcache-validation' && !inputs.skip_uncached && inputs.phase != 'warm'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      options: --init
      image: docker.io/library/archlinux@sha256:fe6972d4dc1f660c0c10f4c41b2de8986bab89e7e2955378f8beadb8ebcd7433
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: operator
          persist-credentials: false
      - uses: ./operator/.github/actions/boringcache-arch-setup
      - name: Build and check the native Arch producers
        working-directory: operator
        run: bash .github/boringcache-arch.sh
      - name: Retain source, timing and native cache evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: arch-uncached-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/validation

  cold:
    name: BoringCache Arch cold
    if: github.repository == 'boringcache/Conary' && github.ref == 'refs/heads/boringcache-validation' && inputs.phase != 'warm'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      options: --init
      image: docker.io/library/archlinux@sha256:fe6972d4dc1f660c0c10f4c41b2de8986bab89e7e2955378f8beadb8ebcd7433
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: operator
          persist-credentials: false
      - uses: ./operator/.github/actions/boringcache-arch-setup
      - name: Install the native compiler-cache prerequisite
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: sccache@0.17.0
      - name: Configure the BoringCache compiler backend
        id: cache
        uses: boringcache/one@90111526eb218a7f1e119ac2b29f765bd4d82734 # v1.21.0
        with:
          mode: sccache
          working-directory: operator
          cli-version: ${{ inputs.cli_version }}
          trust-policy: publish
          fail-on-cache-error: true
      - name: Build and check the native Arch producers
        working-directory: operator
        run: bash .github/boringcache-arch.sh
      - name: Retain source, timing and native cache evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: arch-cold-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/validation
            ${{ steps.cache.outputs.evidence-path }}

  warm:
    name: BoringCache Arch warm
    needs: cold
    if: always() && !cancelled() && github.repository == 'boringcache/Conary' && github.ref == 'refs/heads/boringcache-validation' && (needs.cold.result == 'success' || inputs.phase == 'warm')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      options: --init
      image: docker.io/library/archlinux@sha256:fe6972d4dc1f660c0c10f4c41b2de8986bab89e7e2955378f8beadb8ebcd7433
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: operator
          persist-credentials: false
      - uses: ./operator/.github/actions/boringcache-arch-setup
      - name: Install the native compiler-cache prerequisite
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: sccache@0.17.0
      - name: Configure the BoringCache compiler backend
        id: cache
        uses: boringcache/one@90111526eb218a7f1e119ac2b29f765bd4d82734 # v1.21.0
        with:
          mode: sccache
          working-directory: operator
          cli-version: ${{ inputs.cli_version }}
          trust-policy: restore
          fail-on-cache-error: true
          fail-on-cache-miss: true
      - name: Build and check the native Arch producers
        working-directory: operator
        run: bash .github/boringcache-arch.sh
      - name: Retain source, timing and native cache evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: arch-warm-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/validation
            ${{ steps.cache.outputs.evidence-path }}
