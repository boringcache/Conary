workspace = "boringcache/conary-onboarding"

[adapters.cargo]
profiles = ["remi-release"]
compiler-cache = "sccache"
no-git = true
fail-on-cache-error = true
command = ["cargo", "build", "-p", "remi", "--release", "--locked", "--timings"]

[adapters.sccache]
tag = "remi-ubuntu2404-rust198-cargo-v3"
no-git = true

[profiles.remi-release]
entries = ["registry-cache", "registry-index", "git-db", "remi-target"]

[entries.registry-cache]
path = "~/.cargo/registry/cache"
tag = "remi-cargo-v3-registry-cache"

[entries.registry-index]
path = "~/.cargo/registry/index"
tag = "remi-cargo-v3-registry-index"

[entries.git-db]
path = "~/.cargo/git/db"
tag = "remi-cargo-v3-git-db"

[entries.remi-target]
kind = "cargo-target"
path = "producer/target"
tag = "remi-ubuntu2404-rust198-cargo-v3-target"
